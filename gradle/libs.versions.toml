[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serde = "0.1.11"
serdeJson = "0.1.1"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"
candle = "0.1.1"
candleNn = "0.1.1"
half = "2.5.0"
thiserror = "0.2.1"
procMacro = "0.1.4"
numTraits = "0.1.0"
rayon = "0.1.0"
safetensors = "0.1.0"
libc = "0.1.9"
rand = "0.1.0"
randDistr = "0.1.0"
tracing = "0.1.0"
anyhow = "0.1.1"
clap = "0.1.2"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
serde-json-kotlin = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serdeJson" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
candle-kotlin = { module = "io.github.kotlinmania:candle-kotlin", version.ref = "candle" }
candle-nn-kotlin = { module = "io.github.kotlinmania:candle-nn-kotlin", version.ref = "candleNn" }
half-kotlin = { module = "io.github.kotlinmania:half-kotlin", version.ref = "half" }
thiserror-kotlin = { module = "io.github.kotlinmania:thiserror-kotlin", version.ref = "thiserror" }
proc-macro-kotlin = { module = "io.github.kotlinmania:proc-macro-kotlin", version.ref = "procMacro" }
num-traits-kotlin = { module = "io.github.kotlinmania:num-traits-kotlin", version.ref = "numTraits" }
rayon-kotlin = { module = "io.github.kotlinmania:rayon-kotlin", version.ref = "rayon" }
safetensors-kotlin = { module = "io.github.kotlinmania:safetensors-kotlin", version.ref = "safetensors" }
libc-kotlin = { module = "io.github.kotlinmania:libc-kotlin", version.ref = "libc" }
rand-kotlin = { module = "io.github.kotlinmania:rand-kotlin", version.ref = "rand" }
rand-distr-kotlin = { module = "io.github.kotlinmania:rand-distr-kotlin", version.ref = "randDistr" }
tracing-kotlin = { module = "io.github.kotlinmania:tracing-kotlin", version.ref = "tracing" }
anyhow-kotlin = { module = "io.github.kotlinmania:anyhow-kotlin", version.ref = "anyhow" }
clap-kotlin = { module = "io.github.kotlinmania:clap-kotlin", version.ref = "clap" }

[bundles]
candletransformers-commonMain = [
  "kotlinx-coroutines-core",
  "serde-kotlin",
  "serde-json-kotlin",
  "kotlinx-datetime",
  "collections-immutable",
  "candle-kotlin",
  "candle-nn-kotlin",
  "half-kotlin",
  "thiserror-kotlin",
  "proc-macro-kotlin",
  "num-traits-kotlin",
  "rayon-kotlin",
  "safetensors-kotlin",
  "libc-kotlin",
  "rand-kotlin",
  "rand-distr-kotlin",
  "tracing-kotlin",
]
candletransformers-commonTest = [
  "kotlinx-coroutines-test",
  "anyhow-kotlin",
  "clap-kotlin",
]
